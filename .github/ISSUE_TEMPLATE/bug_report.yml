name: Bug report
description: A reproducible problem in the desktop app
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: TCode version
      placeholder: "e.g. 0.1.631"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "e.g. Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots / logs
      description: Please redact any secrets, tokens, and private code.
    validations:
      required: false
  - type: input
    id: source
    attributes:
      label: How did you hear about TCode? (optional)
      description: A DM, a post, a friend, or an invite code if you had one. This only helps us understand which channels bring in testers.
      placeholder: "e.g. invite code / a friend / Hacker News"
    validations:
      required: false
